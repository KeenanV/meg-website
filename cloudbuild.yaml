# cloudbuild.yaml
substitutions:
  _BUCKET: "gs://meg-site-prod"   # <--- set this in your trigger too

steps:
  - name: "gcr.io/cloud-builders/npm"
    dir: "apps/web"
    args: ["ci"]

  - name: "gcr.io/cloud-builders/npm"
    dir: "apps/web"
    args: ["run", "build"]

  # Upload files and set caching:
  # - HTML: cache-bust quickly
  # - assets: cache long with immutable
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        gsutil -m rsync -d -r apps/web/dist ${_BUCKET}

        # HTML (short cache)
        find apps/web/dist -type f -name "*.html" -print0 | \
          xargs -0 -n 50 -I {} gsutil setmeta -h "Cache-Control:no-cache, max-age=0" "${_BUCKET}/{}"

        # Everything else (long cache)
        find apps/web/dist -type f ! -name "*.html" -print0 | \
          xargs -0 -n 50 -I {} gsutil setmeta -h "Cache-Control:public, max-age=31536000, immutable" "${_BUCKET}/{}"

artifacts:
  objects:
    location: "${_BUCKET}"
    paths: ["apps/web/dist/**"]