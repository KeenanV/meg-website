version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/apps/web', '/apps/studio', '/apps/backend']
    schedule:
      interval: weekly
    target-branch: staging
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: staging
  - package-ecosystem: docker
    directories: ['/apps/backend', '/staging', '/editorial']
    schedule:
      interval: weekly
    target-branch: staging
