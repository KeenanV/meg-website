name: Check website and Studio

on:
  pull_request:
    branches: [staging, master]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require production releases from this repository's staging branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$BASE" == "master" && ( "$HEAD" != "staging" || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ) ]]; then
            echo "Production releases must come from this repository's staging branch."
            exit 1
          fi
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_SANITY_PROJECT_ID: ap0mc9ri
      PUBLIC_SANITY_DATASET: ${{ github.base_ref == 'staging' && 'staging' || 'production' }}
      SANITY_STUDIO_DATASET: ${{ github.base_ref == 'staging' && 'staging' || 'production' }}
      SITE_URL: https://megvandeusen.com
      PUBLIC_CONTACT_API_URL: https://website-backend-348807509213.us-west1.run.app/contact
      PUBLIC_RECAPTCHA_SITE_KEY: 6LdoLc8tAAAAAKmmIu7i3h3CrQPqIl5R-HAISA0Z
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: npm run verify
