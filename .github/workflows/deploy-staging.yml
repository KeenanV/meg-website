name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

# Finish the active release, retaining only the newest pending content rebuild.
concurrency:
  group: firebase-staging-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    environment:
      name: Staging
      url: https://staging.megvandeusen.com
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      PUBLIC_SANITY_PROJECT_ID: ap0mc9ri
      PUBLIC_SANITY_DATASET: staging
      SANITY_STUDIO_DATASET: staging
      SITE_URL: https://staging.megvandeusen.com
      PUBLIC_CONTACT_API_URL: /contact
      PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
      GOOGLE_CLOUD_QUOTA_PROJECT: megvandeusen-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: npm run verify
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: megvandeusen-staging
          workload_identity_provider: projects/76495183695/locations/global/workloadIdentityPools/github/providers/meg-website
          service_account: github-hosting@megvandeusen-staging.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Deploy staging Studio
        working-directory: apps/studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
        run: npx --no-install sanity deploy --yes --schema-required
      - name: Deploy protected staging site and backend
        run: node scripts/deploy-staging.mjs
      - name: Verify staging access controls and CAPTCHA enforcement
        env:
          STAGING_REVIEWER: ${{ secrets.STAGING_REVIEWER }}
        run: node scripts/check-staging.mjs
