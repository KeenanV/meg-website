name: Deploy production
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_type == 'content' && 'Publish Sanity content — production' || 'Deploy code — production' }}

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deployment_type:
        description: Content publishing skips unchanged Studio and backend deployments.
        type: choice
        options: [full, content]
        default: full

permissions:
  contents: read

# Finish the active release, retaining only the newest pending content rebuild.
concurrency:
  group: firebase-website-release
  cancel-in-progress: false

env:
  PUBLIC_SANITY_PROJECT_ID: ap0mc9ri
  PUBLIC_SANITY_DATASET: production
  SANITY_STUDIO_DATASET: production
  SITE_URL: https://megvandeusen.com
  PUBLIC_CONTACT_API_URL: https://website-backend-348807509213.us-west1.run.app/contact
  PUBLIC_RECAPTCHA_SITE_KEY: 6LdoLc8tAAAAAKmmIu7i3h3CrQPqIl5R-HAISA0Z
  GOOGLE_CLOUD_QUOTA_PROJECT: megvandeusen-website

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.publishing.outputs.mode }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select safe publishing path
        id: publishing
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_DEPLOYMENT: ${{ inputs.deployment_type || 'full' }}
          DEPLOYMENT_WORKFLOW: deploy.yml
        run: node scripts/publishing-mode.mjs
      - uses: ./.github/actions/setup-project
        with:
          content-only: ${{ steps.publishing.outputs.mode == 'content' }}
      - name: Capture published content revision
        run: node scripts/content-snapshot.mjs capture
      - if: steps.publishing.outputs.mode == 'full'
        run: npm run verify
      - if: steps.publishing.outputs.mode == 'content'
        run: npm run verify:content
      - name: Build private preview without cloud credentials
        if: steps.publishing.outputs.mode == 'full'
        env:
          EDITORIAL_PREVIEW: 'true'
        run: npm run build --prefix apps/web
      - name: Reject mixed content snapshots
        run: node scripts/content-snapshot.mjs check
      - name: Package verified output
        id: archive
        env:
          DEPLOYMENT_TYPE: ${{ steps.publishing.outputs.mode }}
        run: node scripts/deployment-artifact.mjs pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: deployment-output
          path: .private/deploy-artifact.tar.gz
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    environment:
      name: Production
      url: https://megvandeusen.com
    env:
      # Environment variables are available only after selecting Production.
      HOSTING_RELEASE_CHANNEL: ${{ vars.HOSTING_RELEASE_CHANNEL || 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: .private
          merge-multiple: true
      - name: Verify artifact identity before extraction
        env:
          EXPECTED_ARTIFACT_SHA: ${{ needs.build.outputs.sha256 }}
        run: node scripts/deployment-artifact.mjs unpack
      - name: Install locked deployment tools without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/backend
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: megvandeusen-website
          workload_identity_provider: projects/348807509213/locations/global/workloadIdentityPools/github/providers/meg-website
          service_account: github-hosting@megvandeusen-website.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Deploy contact and publishing backend
        if: needs.build.outputs.mode == 'full'
        run: node scripts/deploy-backend.mjs --verified
      - name: Deploy private editorial preview
        if: needs.build.outputs.mode == 'full'
        run: node scripts/deploy-editorial.mjs production --built
      - name: Deploy checked output to the configured channel
        run: node scripts/deploy-hosting.mjs
      - name: Full deployment completed
        if: needs.build.outputs.mode == 'full'
        run: echo 'Full production code deployment completed.'

  studio:
    needs: [build, deploy]
    if: needs.build.outputs.mode == 'full'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: .private
          merge-multiple: true
      - name: Verify artifact identity before extraction
        env:
          EXPECTED_ARTIFACT_SHA: ${{ needs.build.outputs.sha256 }}
        run: node scripts/deployment-artifact.mjs unpack
      - name: Install locked Studio deployment tools without lifecycle scripts
        run: npm ci --ignore-scripts --prefix apps/studio
      - name: Deploy prebuilt Studio without cloud identity
        working-directory: apps/studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
        run: npx --no-install sanity deploy --yes --no-build --schema-required
