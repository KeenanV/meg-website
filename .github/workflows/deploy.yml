name: Deploy website preview

on:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-published]

permissions:
  contents: read

# Finish the active release, retaining only the newest pending content rebuild.
concurrency:
  group: firebase-website-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PUBLIC_SANITY_PROJECT_ID: ap0mc9ri
      PUBLIC_SANITY_DATASET: production
      SITE_URL: https://megvandeusen.com
      PUBLIC_CONTACT_API_URL: https://website-backend-348807509213.us-west1.run.app/contact
      PUBLIC_RECAPTCHA_SITE_KEY: 6LdoLc8tAAAAAKmmIu7i3h3CrQPqIl5R-HAISA0Z
      GOOGLE_CLOUD_QUOTA_PROJECT: megvandeusen-website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/studio/package-lock.json
            apps/backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix apps/studio
      - run: npm ci --prefix apps/backend
      - run: npm run verify
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: megvandeusen-website
          workload_identity_provider: projects/348807509213/locations/global/workloadIdentityPools/github/providers/meg-website
          service_account: github-hosting@megvandeusen-website.iam.gserviceaccount.com
      - name: Deploy checked output to preview only
        run: node scripts/deploy-preview.mjs
